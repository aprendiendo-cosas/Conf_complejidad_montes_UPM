<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo escenas 1–4</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c2a30; overflow: hidden; }
  body { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg#stage { width: 100vw; height: 100vh; display: block; cursor: pointer; }
  svg text { font-family: inherit; }

  /* ---------- Mecánica general: capas que aparecen ---------- */
  .L { opacity: 0; transition: opacity .9s ease; pointer-events: none; }
  .L.on { opacity: 1; transition-delay: var(--d, 0s); }

  .pop { opacity: 0; transform: scale(.2); transform-box: fill-box; transform-origin: 50% 100%;
         transition: opacity .4s ease, transform .7s cubic-bezier(.3,1.6,.5,1); }
  .pop.on { opacity: 1; transform: none; transition-delay: var(--d, 0s); }

  .draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0;
          transition: stroke-dashoffset 1.1s ease, opacity .3s; }
  .draw.on { stroke-dashoffset: 0; opacity: 1; transition-delay: var(--d, 0s); }

  /* ---------- Árboles y degradación ---------- */
  .tree { transition: opacity 1.4s ease; }
  .crown { transition: fill 1.6s ease; }
  .f-fire .zfire .crown { fill: #3b302b; }
  .f-fire .zfire .trunk { fill: #1f1a17; }
  .f-erosion .zero { opacity: 0; }
  .f-decline .zdec .crown { fill: #b98a4f; }
  .f-decline .zdec.grey .crown { fill: #a09d8f; }

  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; }
                    20% { opacity: .75; }
                    100% { transform: translateY(-170px) scale(2.2); opacity: 0; } }
  .smoke circle { transform-box: fill-box; transform-origin: center; animation: rise 5s linear infinite; }

  /* ---------- Gafas ---------- */
  .lens { r: 0px; transition: r 1.5s cubic-bezier(.6,0,.2,1); }
  .f-glasses .lens { r: 165px; }
  .f-glasses.f-lensfull .lens { r: 1400px; }
  #frame { opacity: 0; transform: scale(.5); transform-box: view-box; transform-origin: 800px 430px;
           transition: opacity .8s ease, transform 1.2s cubic-bezier(.3,1.3,.5,1); }
  .f-glasses #frame { opacity: 1; transform: none; }
  .f-glasses.f-lensfull #frame { opacity: 0; transform: scale(5); transition: opacity .9s ease, transform 1.5s cubic-bezier(.6,0,.2,1); }

  /* ---------- Red sistémica ---------- */
  .node circle.core { stroke-width: 5; }
  @keyframes flow { to { stroke-dashoffset: -0.14; } }
  .loopflow { stroke-dasharray: .045 .025; animation: flow 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
  @keyframes pulse { 0% { r: 40px; opacity: .9; } 100% { r: 85px; opacity: 0; } }
  .pulse { animation: pulse 1.8s ease-out infinite; }

  #syslabel { transition: opacity .5s; }
  #edges { transition: opacity .8s; }
  .f-loop #edges { opacity: .25; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; right: 14px; bottom: 10px; color: #ffffffaa; font-size: 12px;
         background: #00000055; padding: 4px 10px; border-radius: 12px; user-select: none; }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd7e2"/>
      <stop offset=".7" stop-color="#eef0e4"/>
    </linearGradient>
    <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7b67c"/>
      <stop offset="1" stop-color="#8fa266"/>
    </linearGradient>
    <radialGradient id="burn">
      <stop offset="0" stop-color="#2a211d" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2a211d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e9eef2"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4c55c"/>
    </marker>
    <mask id="lensMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <rect width="1600" height="900" fill="#000"/>
      <circle class="lens" cx="620" cy="430" fill="#fff"/>
      <circle class="lens" cx="980" cy="430" fill="#fff"/>
    </mask>
  </defs>

  <!-- ===== PAISAJE BASE ===== -->
  <g id="landscape">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <g id="mountains"></g>
    <path id="hill" fill="url(#hillG)"/>
    <g id="erosionPatch" class="L" data-on="erosion"></g>
    <g id="burnPatch" class="L" data-on="fire">
      <ellipse cx="740" cy="590" rx="190" ry="170" fill="url(#burn)"/>
    </g>
    <g id="trees"></g>
    <path id="meadow" fill="#b9c58c"/>
    <path id="river" fill="none" stroke="#7fb3cf" stroke-width="16" stroke-linecap="round"
          d="M1590,712 C1480,730 1420,700 1330,760 S1180,800 1150,840 S1060,880 1010,905"/>
    <path fill="none" stroke="#a9d0e2" stroke-width="5" stroke-linecap="round" opacity=".8"
          d="M1590,712 C1480,730 1420,700 1330,760 S1180,800 1150,840 S1060,880 1010,905"/>
    <g id="village" class="L" data-on="village"></g>
    <g id="smoke" class="L smoke" data-on="fire"></g>
    <g id="degLabels"></g>
    <g id="humans"></g>
  </g>

  <!-- velo para la hipótesis -->
  <g class="L" data-on="dim"><rect width="1600" height="900" fill="#f3f1e8" opacity=".62"/></g>

  <!-- ===== TEXTOS DEL HILO ===== -->
  <g class="L" data-on="title">
    <rect x="50" y="70" width="980" height="215" rx="18" fill="#f6f3ea" opacity=".82"/>
    <text x="85" y="150" font-size="58" font-weight="600" fill="#1f3a2e">Retos de restaurar la naturaleza</text>
    <text x="85" y="215" font-size="58" font-weight="600" fill="#1f3a2e">en un mundo complejo</text>
    <text x="87" y="262" font-size="23" fill="#4a5a50">F. J. Bonet · ETSI de Montes, Forestal y del Medio Natural (UPM) · 19-11-2026</text>
  </g>
  <g class="L" data-on="q1"><text x="800" y="150" text-anchor="middle" font-size="76" font-weight="600" fill="#1f3a2e">¿Qué veis?</text></g>
  <g class="L" data-on="q2"><text x="800" y="150" text-anchor="middle" font-size="60" font-weight="600" fill="#1f3a2e">¿Sabemos gestionarlo de forma sostenible?</text></g>
  <g class="L" data-on="q3"><text x="800" y="140" text-anchor="middle" font-size="60" font-weight="600" fill="#1f3a2e">¿Por qué ocurre esto tan a menudo?</text></g>
  <g class="L" data-on="hyp">
    <text x="800" y="400" text-anchor="middle" font-size="56" fill="#3d4a42">No nos falta ciencia ni técnica.</text>
    <text x="800" y="490" text-anchor="middle" font-size="64" font-weight="700" fill="#1f3a2e">Nos falta la mirada compleja.</text>
  </g>

  <!-- ===== CAPA SISTÉMICA (solo visible a través de las gafas) ===== -->
  <g id="systemic" mask="url(#lensMask)">
    <use href="#landscape"/>
    <rect width="1600" height="900" fill="#13263a" opacity=".7"/>
    <g id="past" class="L" data-on="past"></g>
    <g id="hier"></g>
    <g id="edges"></g>
    <g id="loop" class="L" data-on="loop"></g>
    <g id="nodes"></g>
    <g class="L" data-on="ses">
      <text x="70" y="120" font-size="66" font-weight="700" fill="#f4c55c">Socioecosistema</text>
      <text x="72" y="170" font-size="28" fill="#e9eef2">El reto no es gestionar un bosque, sino un socioecosistema</text>
    </g>
    <text id="syslabel" x="70" y="120" font-size="44" font-weight="600" fill="#e9eef2" opacity="0"></text>
  </g>

  <!-- montura de las gafas -->
  <g id="frame" fill="none" stroke="#24292b" stroke-linecap="round">
    <circle cx="620" cy="430" r="168" stroke-width="18"/>
    <circle cx="980" cy="430" r="168" stroke-width="18"/>
    <path d="M776,400 Q800,370 824,400" stroke-width="16"/>
    <path d="M455,405 L330,360" stroke-width="14"/>
    <path d="M1145,405 L1270,360" stroke-width="14"/>
  </g>
</svg>
<div id="hud"></div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const svg = $('#stage');

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// generador pseudoaleatorio con semilla: el paisaje sale igual siempre
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];

// ---------- Geometría del terreno ----------
const f = x => 360 + 0.00025 * (x - 350) ** 2;     // perfil de la ladera
const m = x => 790 + x * 0.035;                    // borde del prado en primer plano

// montañas lejanas (Sierra) con nieve
(() => {
  const g = $('#mountains');
  let d = 'M0,420 ';
  const peaks = [[0,420],[120,330],[230,370],[380,250],[520,330],[640,290],[760,345],[900,300],[1040,360],[1180,320],[1320,380],[1460,350],[1600,400]];
  peaks.forEach(([x,y]) => d += `L${x},${y} `);
  el('path', { d: d + 'L1600,900 L0,900 Z', fill: '#b6c4ca' }, g);
  el('path', { d: 'M350,272 L380,250 L410,268 L395,275 L380,266 L365,278 Z M620,300 L640,290 L662,301 L648,305 L640,298 L630,307 Z M885,309 L900,300 L918,311 L905,314 Z', fill: '#f4f6f7' }, g);
})();

// ladera y prado
(() => {
  let d = 'M0,' + f(0);
  for (let x = 0; x <= 1600; x += 20) d += ` L${x},${f(x).toFixed(1)}`;
  $('#hill').setAttribute('d', d + ' L1600,900 L0,900 Z');
  let dm = 'M0,' + m(0);
  for (let x = 0; x <= 1600; x += 40) dm += ` L${x},${(m(x) + 6 * Math.sin(x / 90)).toFixed(1)}`;
  $('#meadow').setAttribute('d', dm + ' L1600,900 L0,900 Z');
})();

// ---------- Bosque ----------
const PINE = ['#2f5d3a', '#356b42', '#2a5234', '#3b6f45'];
const OAK  = ['#6f9a4a', '#7ea653', '#5f8c42'];
(() => {
  const g = $('#trees');
  const pts = [];
  for (let i = 0; i < 190; i++) {
    const x = 60 + rnd() * 1060;
    const top = f(x) + 12, bot = Math.min(f(x) + 300, m(x) - 12);
    pts.push([x, top + rnd() * (bot - top)]);
  }
  pts.sort((a, b) => a[1] - b[1]);
  for (const [x, y] of pts) {
    const s = 0.55 + (y - 340) / 480 * 0.9;
    const cls = ['tree'];
    if (x > 600 && x < 870) cls.push('zfire');
    if (x > 895 && x < 1120) { cls.push('zdec'); if (rnd() < .35) cls.push('grey'); }
    if (x > 85 && x < 380 && y < f(x) + 200) cls.push('zero');
    const t = el('g', { class: cls.join(' '), transform: `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s.toFixed(2)})` }, g);
    if (rnd() < 0.66) {
      el('rect', { class: 'trunk', x: -3, y: -10, width: 6, height: 12, fill: '#5b4636' }, t);
      el('path', { class: 'crown', d: 'M0,-64 L15,-36 L8,-36 L22,-8 L-22,-8 L-8,-36 L-15,-36 Z', fill: pick(PINE) }, t);
    } else {
      el('rect', { class: 'trunk', x: -3, y: -16, width: 6, height: 18, fill: '#5b4636' }, t);
      el('ellipse', { class: 'crown', cx: 0, cy: -32, rx: 21, ry: 18, fill: pick(OAK) }, t);
    }
  }
})();

// ---------- Degradación ----------
(() => {
  // erosión: suelo desnudo con cárcavas
  const g = $('#erosionPatch');
  let d = '';
  for (let x = 85; x <= 385; x += 15) d += (d ? ' L' : 'M') + `${x},${(f(x) + 8 + 6 * Math.sin(x / 23)).toFixed(1)}`;
  for (let x = 385; x >= 85; x -= 15) d += ` L${x},${(f(x) + 205 + 10 * Math.sin(x / 31)).toFixed(1)}`;
  el('path', { d: d + ' Z', fill: '#c9a46a' }, g);
  for (let i = 0; i < 7; i++) {
    let x = 110 + i * 40 + rnd() * 15, y = f(x) + 20;
    let p = `M${x},${y}`;
    for (let k = 0; k < 6; k++) { x += (rnd() - .5) * 18; y += 28; p += ` L${x.toFixed(1)},${y}`; }
    el('path', { d: p, stroke: '#7d5630', 'stroke-width': 4 + rnd() * 3, fill: 'none', 'stroke-linecap': 'round' }, g);
  }
  // humo del incendio
  const sm = $('#smoke');
  for (let i = 0; i < 14; i++) {
    const c = el('circle', { cx: 640 + rnd() * 210, cy: 420 + rnd() * 160, r: 18 + rnd() * 16, fill: '#6b6763' }, sm);
    c.style.animationDelay = (-rnd() * 5).toFixed(2) + 's';
  }
  // etiquetas de los modos de fallo
  const lab = [['incendio', 745, 330, 'fire'], ['erosión', 235, 335, 'erosion'], ['decaimiento', 1010, 430, 'decline']];
  for (const [t, x, y, flag] of lab) {
    const gg = el('g', { class: 'L', 'data-on': flag, style: '--d:.8s' }, $('#degLabels'));
    el('rect', { x: x - t.length * 8.5 - 14, y: y - 26, width: t.length * 17 + 28, height: 38, rx: 19, fill: '#2b2522', opacity: .85 }, gg);
    el('text', { x, y: y + 1, 'text-anchor': 'middle', 'font-size': 24, fill: '#f6e8d6' }, gg).textContent = t;
  }
})();

// ---------- Pueblo ----------
(() => {
  const g = $('#village');
  const hs = [];
  for (let i = 0; i < 9; i++) { const x = 1235 + i * 30 + rnd() * 12; hs.push([x, f(x) + 18 + rnd() * 30]); }
  hs.sort((a, b) => a[1] - b[1]);
  hs.forEach(([x, y], i) => {
    const h = el('g', { transform: `translate(${x.toFixed(1)},${y.toFixed(1)})` }, g);
    if (i === 3) {
      el('rect', { x: -7, y: -52, width: 14, height: 52, fill: '#e9dfcc', stroke: '#8a7a66' }, h);
      el('path', { d: 'M-9,-52 L0,-66 L9,-52 Z', fill: '#a8493a' }, h);
    }
    el('rect', { x: -14, y: -18, width: 28, height: 18, fill: '#f1e8d8', stroke: '#8a7a66' }, h);
    el('path', { d: 'M-17,-18 L0,-31 L17,-18 Z', fill: '#b5523b' }, h);
    el('rect', { x: -3, y: -10, width: 6, height: 10, fill: '#6b5a48' }, h);
  });
  // camino del pueblo al monte
  el('path', { d: 'M1250,640 C1170,690 1080,650 1010,700 S860,770 720,740', fill: 'none', stroke: '#e3d5ad', 'stroke-width': 5, 'stroke-dasharray': '12 9' }, g);
})();

// ---------- Personas y actividades ----------
(() => {
  const g = $('#humans');
  const SKIN = '#e5c19c', INK = '#33302c';
  function person(parent, color, kind) {
    const p = el('g', {}, parent);
    const legs = kind === 'run' ? 'M-10,0 L0,-17 L11,-5' : 'M-5,0 L0,-17 L5,0';
    el('path', { d: legs, stroke: INK, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, p);
    el('rect', { x: -7, y: -36, width: 14, height: 21, rx: 5, fill: color, transform: kind === 'run' ? 'rotate(12,0,-20)' : '' }, p);
    el('circle', { cx: kind === 'run' ? 4 : 0, cy: -43, r: 7, fill: SKIN }, p);
    if (kind === 'axe') { el('path', { d: 'M8,-28 L20,-50', stroke: '#6b4b2b', 'stroke-width': 3 }, p);
      el('path', { d: 'M17,-52 L26,-48 L22,-42 Z', fill: '#8c949a' }, p); }
    if (kind === 'staff') el('path', { d: 'M11,0 L12,-54 Q16,-60 20,-55', stroke: '#6b4b2b', 'stroke-width': 3, fill: 'none' }, p);
    if (kind === 'rifle') el('path', { d: 'M4,-30 L30,-44', stroke: '#2e2e2e', 'stroke-width': 3.5 }, p);
    if (kind === 'basket') { el('ellipse', { cx: 12, cy: -18, rx: 8, ry: 6, fill: '#a77b48' }, p);
      el('path', { d: 'M5,-20 Q12,-32 19,-20', stroke: '#a77b48', 'stroke-width': 2, fill: 'none' }, p); }
    return p;
  }
  function sheep(parent, x, y) {
    const s = el('g', { transform: `translate(${x},${y})` }, parent);
    el('path', { d: 'M-6,0 L-6,-7 M6,0 L6,-7', stroke: INK, 'stroke-width': 2.5 }, s);
    el('ellipse', { cx: 0, cy: -11, rx: 12, ry: 8, fill: '#f4f1ea', stroke: '#9a9486' }, s);
    el('circle', { cx: 12, cy: -15, r: 4.5, fill: '#3a3632' }, s);
  }
  function tag(parent, text, y = 22) {
    const w = text.length * 11 + 20;
    el('rect', { x: -w / 2, y: y - 4, width: w, height: 26, rx: 13, fill: '#fffaf0', opacity: .9 }, parent);
    el('text', { x: 0, y: y + 15, 'text-anchor': 'middle', 'font-size': 17, fill: '#3c3a33' }, parent).textContent = text;
  }
  const acts = [
    { x: 1165, y: 712, label: 'madera', draw: p => { person(p, '#c45a3c', 'axe');
        [[-22,-4],[-30,-4],[-26,-11]].forEach(([cx,cy]) => el('circle', { cx, cy, r: 4.5, fill: '#9a6b42', stroke: '#6b4b2b' }, p)); } },
    { x: 470, y: 828, label: 'pastoreo', draw: p => { person(p, '#6d7f9a', 'staff');
        [[40,2],[70,-6],[95,6],[60,14],[125,0],[30,20]].forEach(([sx,sy]) => sheep(p, sx, sy)); } },
    { x: 205, y: 735, label: 'caza', draw: p => { person(p, '#5d6b3a', 'rifle');
        el('ellipse', { cx: -24, cy: -9, rx: 11, ry: 5, fill: '#8a5a33' }, p);
        el('circle', { cx: -34, cy: -13, r: 4, fill: '#8a5a33' }, p); } },
    { x: 790, y: 805, label: 'setas', draw: p => person(p, '#a0628f', 'basket') },
    { x: 1035, y: 700, label: 'ocio', draw: p => person(p, '#2f8fb0', 'run') },
  ];
  acts.forEach((a, i) => {
    const outer = el('g', { transform: `translate(${a.x},${a.y}) scale(1.45)` }, g);
    const inner = el('g', { class: 'pop', 'data-on': 'humans', style: `--d:${(0.35 + i * 0.45).toFixed(2)}s` }, outer);
    a.draw(inner);
    tag(inner, a.label);
  });
})();

// ---------- Red sistémica ----------
const NODES = {
  clima:    { label: 'Clima',    x: 1300, y: 170, c: '#6fb3e0' },
  arboles:  { label: 'Árboles',  x: 560,  y: 500, c: '#7cc47f' },
  fauna:    { label: 'Fauna',    x: 250,  y: 560, c: '#7cc47f' },
  suelo:    { label: 'Suelo',    x: 380,  y: 700, c: '#c9a46a' },
  agua:     { label: 'Agua',     x: 1120, y: 790, c: '#6fb3e0' },
  fuego:    { label: 'Fuego',    x: 850,  y: 400, c: '#e46b4f' },
  ganado:   { label: 'Ganado',   x: 620,  y: 815, c: '#f2a65a' },
  personas: { label: 'Personas', x: 1340, y: 590, c: '#f2a65a' },
};
const EDGES = [
  ['clima','arboles'],['clima','agua'],['clima','fuego'],['arboles','suelo'],['suelo','agua'],['agua','arboles'],
  ['arboles','fuego'],['fuego','suelo'],['ganado','arboles'],['personas','ganado'],['personas','arboles'],
  ['personas','fuego'],['fauna','arboles'],['agua','personas'],
];
const LOOP = [['arboles','suelo'],['suelo','agua'],['agua','arboles']];
const R = 38;

function curve(a, b, bend = .18, shrink = R + 8) {
  const A = NODES[a], B = NODES[b];
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
  const ux = dx / L, uy = dy / L;
  const x1 = A.x + ux * shrink, y1 = A.y + uy * shrink, x2 = B.x - ux * shrink, y2 = B.y - uy * shrink;
  const cx = (x1 + x2) / 2 - uy * L * bend, cy = (y1 + y2) / 2 + ux * L * bend;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
}

(() => {
  const ge = $('#edges');
  EDGES.forEach(([a, b], i) => el('path', { class: 'draw', 'data-on': 'rel', pathLength: 1, d: curve(a, b),
    fill: 'none', stroke: '#e9eef2', 'stroke-width': 3, opacity: .85, 'marker-end': 'url(#arrow)', style: `--d:${(i * 0.09).toFixed(2)}s` }, ge));

  const gl = $('#loop');
  LOOP.forEach(([a, b]) => {
    el('path', { d: curve(a, b, .12), fill: 'none', stroke: '#f4c55c', 'stroke-width': 10, opacity: .25 }, gl);
    el('path', { class: 'loopflow', pathLength: 1, d: curve(a, b, .12), fill: 'none', stroke: '#f4c55c', 'stroke-width': 7, 'marker-end': 'url(#arrowA)' }, gl);
  });
  const cx = (NODES.arboles.x + NODES.suelo.x + NODES.agua.x) / 3, cy = (NODES.arboles.y + NODES.suelo.y + NODES.agua.y) / 3;
  const sp = el('g', { transform: `translate(${cx},${cy})` }, gl);
  el('path', { class: 'spin', d: 'M0,-34 A34,34 0 1 1 -29,-17', fill: 'none', stroke: '#f4c55c', 'stroke-width': 6, 'marker-end': 'url(#arrowA)' }, sp);
  el('text', { y: 70, 'text-anchor': 'middle', 'font-size': 24, fill: '#f4c55c' }, sp).textContent = 'autorregulación';

  const gn = $('#nodes');
  Object.entries(NODES).forEach(([k, n], i) => {
    const outer = el('g', { transform: `translate(${n.x},${n.y})` }, gn);
    const g = el('g', { class: 'pop node', 'data-on': 'nodes', style: `--d:${(0.15 + i * 0.12).toFixed(2)}s; transform-origin:50% 50%` }, outer);
    if (k === 'personas' || k === 'ganado') {
      const pg = el('g', { class: 'L', 'data-on': 'ses' }, g);
      el('circle', { class: 'pulse', r: 40, fill: 'none', stroke: '#f2a65a', 'stroke-width': 4 }, pg);
    }
    el('circle', { class: 'core', r: R, fill: '#13263a', stroke: n.c }, g);
    el('circle', { r: 11, fill: n.c }, g);
    el('text', { y: R + 30, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 600, fill: '#e9eef2' }, g).textContent = n.label;
  });

  // jerarquía de escalas, anidadas alrededor de un árbol
  const gh = $('#hier');
  const lv = [
    ['árbol', 560, 500, 46, 46], ['rodal', 560, 520, 150, 105], ['monte', 640, 560, 400, 230],
    ['cuenca', 800, 560, 740, 330], ['clima regional', 800, 450, 795, 445],
  ];
  lv.forEach(([t, x, y, rx, ry], i) => {
    const gg = el('g', { class: 'L', 'data-on': 'hier', style: `--d:${(i * 0.55).toFixed(2)}s` }, gh);
    el('ellipse', { cx: x, cy: y, rx, ry, fill: 'none', stroke: '#9fd3ff', 'stroke-width': 3, 'stroke-dasharray': '10 8', opacity: .9 }, gg);
    const ly = y - ry + 34;
    el('text', { x: i === 0 ? x + rx + 8 : x, y: i === 0 ? y + 8 : ly, 'text-anchor': i === 0 ? 'start' : 'middle', 'font-size': 24, 'font-weight': 600, fill: '#9fd3ff' }, gg).textContent = t;
  });

  // el pasado: bancales y carboneras antiguas
  const gp = $('#past');
  for (let k = 40; k <= 230; k += 38) {
    let d = '';
    for (let x = 90; x <= 600; x += 15) d += (d ? ' L' : 'M') + `${x},${(f(x) + k + 4 * Math.sin(x / 40 + k)).toFixed(1)}`;
    el('path', { d, fill: 'none', stroke: '#f4c55c', 'stroke-width': 3, 'stroke-dasharray': '6 7', opacity: .9 }, gp);
  }
  [[700, 520], [820, 610], [960, 560], [1060, 640]].forEach(([x, y]) =>
    el('circle', { cx: x, cy: y, r: 22, fill: 'none', stroke: '#f4c55c', 'stroke-width': 3, 'stroke-dasharray': '5 6' }, gp));
  el('text', { x: 330, y: 300, 'text-anchor': 'middle', 'font-size': 24, fill: '#f4c55c' }, gp).textContent = 'bancales (h. 1900)';
  el('text', { x: 880, y: 690, 'text-anchor': 'middle', 'font-size': 24, fill: '#f4c55c' }, gp).textContent = 'carboneras';
})();

// ---------- Guion de pasos ----------
// on / off: capas que se encienden o apagan; sys: rótulo dentro de la mirada sistémica
const STEPS = [
  { name: 'Portada', on: ['title'] },
  { name: '1 · ¿Qué veis?', off: ['title'], on: ['q1'] },
  { name: '1 · ¿Sabemos gestionarlo?', off: ['q1'], on: ['q2'] },
  { name: '2 · Hay humanos', off: ['q2'], on: ['village', 'humans'] },
  { name: '3 · Incendio', on: ['fire'] },
  { name: '3 · Erosión', on: ['erosion'] },
  { name: '3 · Decaimiento', on: ['decline'] },
  { name: '3 · ¿Por qué?', on: ['q3'] },
  { name: '4 · Hipótesis', off: ['fire', 'erosion', 'decline', 'q3'], on: ['dim', 'hyp'] },
  { name: '4 · Las gafas', off: ['hyp'], on: ['glasses', 'nodes', 'rel'] },
  { name: '4 · Elementos', off: ['rel'], on: ['lensfull'], sys: 'Elementos' },
  { name: '4 · Relaciones', on: ['rel'], sys: 'Relaciones' },
  { name: '4 · Autorregulación', on: ['loop'], sys: 'Autorregulación' },
  { name: '4 · Jerarquía', off: ['loop', 'rel'], on: ['hier'], sys: 'Escalas anidadas' },
  { name: '4 · El pasado pesa', off: ['hier'], on: ['past'], sys: 'El pasado pesa' },
  { name: '4 · Socioecosistema', off: ['past'], on: ['rel', 'ses'] },
];

const layered = [...document.querySelectorAll('[data-on]')];
const hud = $('#hud'), sysLabel = $('#syslabel');
let cur = 0;

function flagsAt(i) {
  const s = new Set();
  for (let k = 0; k <= i; k++) { (STEPS[k].off || []).forEach(x => s.delete(x)); (STEPS[k].on || []).forEach(x => s.add(x)); }
  return s;
}
function render() {
  const fl = flagsAt(cur);
  svg.setAttribute('class', [...fl].map(x => 'f-' + x).join(' '));
  layered.forEach(e => e.classList.toggle('on', fl.has(e.dataset.on)));
  const t = STEPS[cur].sys || '';
  sysLabel.setAttribute('opacity', 0);
  clearTimeout(render.timer);
  render.timer = setTimeout(() => { sysLabel.textContent = t; sysLabel.setAttribute('opacity', t ? 1 : 0); }, t ? 350 : 0);
  hud.textContent = `${cur + 1}/${STEPS.length} · ${STEPS[cur].name}   (← → · h oculta)`;
  history.replaceState(null, '', '#' + cur);
}
function go(d) { cur = Math.max(0, Math.min(STEPS.length - 1, cur + d)); render(); }

document.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === 'Home') { cur = 0; render(); }
  else if (e.key === 'End') { cur = STEPS.length - 1; render(); }
  else if (e.key === 'h') hud.classList.toggle('hidden');
});
svg.addEventListener('click', () => go(1));

cur = Math.max(0, Math.min(STEPS.length - 1, parseInt(location.hash.slice(1)) || 0));
render();
})();
</script>
</body>
</html>
